<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mesin Absensi Nahyez</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4df, #ffe0b2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #ed7612;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .scanner-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f7f7f7;
      color: #555;
      min-height: 50px;
    }

    .result {
      margin-top: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #fff4df;
      display: none;
    }

    .result-title {
      font-size: 18px;
      font-weight: bold;
      color: #198754;
      margin-bottom: 10px;
    }

    .token {
      font-weight: bold;
      word-break: break-all;
      color: #333;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Nahyez Baby Meal
    </div>

    <div class="subtitle">
      Mesin Absensi Karyawan
    </div>

    <div class="scanner-title">
      📷 Scan QR Karyawan
    </div>

    <div id="reader"></div>

    <div class="status" id="status">
      Menunggu kamera...
    </div>

    <div class="result" id="result">

      <div class="result-title">
        ✅ QR Berhasil Dibaca
      </div>

      <div>
        QR Token:
      </div>

      <div class="token" id="token">
      </div>

    </div>

    <div class="note">
      Izinkan akses kamera ketika browser memintanya.
      <br>
      QR akan dibaca langsung melalui kamera.
    </div>

  </div>

  <div id="cameraSection" style="
  display:none;
  margin-top:20px;
  text-align:center;
">

  <div style="
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
    color:#333;
  ">
    📸 Foto Kesiapan Booth
  </div>

  <div style="
    color:#666;
    font-size:14px;
    margin-bottom:12px;
    line-height:1.5;
  ">
    Pastikan produk dan area booth sudah
    tertata rapi sebelum mengambil foto.
  </div>

  <video
    id="cameraPreview"
    autoplay
    playsinline
    muted
    style="
      width:100%;
      border-radius:16px;
      background:#111;
      display:block;
    ">
  </video>

  <canvas
    id="photoCanvas"
    style="display:none;">
  </canvas>

  <button
    id="takePhotoButton"
    onclick="ambilFotoBooth()"
    style="
      width:100%;
      margin-top:15px;
      padding:15px;
      border:none;
      border-radius:14px;
      background:#ed7612;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    ">
    📸 AMBIL FOTO BOOTH
  </button>

</div>
  
<script>

let sudahScan = false;

const API_URL =
  'https://script.google.com/macros/s/AKfycbyrDQpUcEfVCuXtZBfCJdCsJfBIje0ohA82T6a3CtHXflH-e4drjyNdbLAVlPy5-6DnGw/exec';


// ==================================================
// QR BERHASIL DIBACA
// ==================================================

function onScanSuccess(decodedText, decodedResult) {

  if (sudahScan) {
    return;
  }

  sudahScan = true;

  console.log("QR berhasil dibaca:", decodedText);

  document.getElementById("status").innerText =
    "QR berhasil dibaca. Memeriksa data karyawan...";

  document.getElementById("token").innerText =
    decodedText;

  document.getElementById("result").style.display =
    "block";

  cekKaryawan(decodedText);
}


// ==================================================
// CEK KARYAWAN KE APPS SCRIPT
// ==================================================

function cekKaryawan(token) {

  const callbackName =
    "nahyezCallback_" + Date.now();

  const script = document.createElement("script");

  const url =
    API_URL +
    "?action=cekQR" +
    "&token=" + encodeURIComponent(token) +
    "&prefix=" + callbackName;


  window[callbackName] = function(data) {

    console.log("Data karyawan:", data);

    delete window[callbackName];

    script.remove();


    // ==============================================
    // QR TIDAK VALID
    // ==============================================

    if (!data.success) {

      document.getElementById("status").innerText =
        "❌ QR tidak valid.";

      document.getElementById("result").innerHTML = `

        <div class="result-title"
             style="color:#dc3545;">
          ❌ QR Tidak Valid
        </div>

        <div>
          ${data.message}
        </div>

      `;

      return;
    }


    // ==============================================
    // KARYAWAN DITEMUKAN
    // ==============================================

    document.getElementById("status").innerText =
      "Karyawan ditemukan. Memeriksa lokasi...";


    document.getElementById("result").innerHTML = `

      <div class="result-title">
        ✅ Karyawan Ditemukan
      </div>

      <div style="
        text-align:left;
        margin-top:15px;
        line-height:1.8;
      ">

        <b>ID Karyawan</b><br>
        ${data.id}

        <br><br>

        <b>Nama</b><br>
        ${data.nama}

        <br><br>

        <b>Outlet</b><br>
        ${data.outlet}

        <br><br>

        <b>QR Token</b><br>
        <span class="token">
          ${data.qrToken || token}
        </span>

        <br><br>

        <div id="gpsStatus">
          📍 Meminta lokasi HP...
        </div>

      </div>

    `;


    // ==============================================
    // MULAI CEK GPS
    // ==============================================

    cekGPS(token);

  };


  // ==============================================
  // TIMEOUT
  // ==============================================

  window.setTimeout(function() {

    if (window[callbackName]) {

      delete window[callbackName];

      script.remove();

      document.getElementById("status").innerText =
        "❌ Tidak dapat menghubungi server.";

    }

  }, 15000);


  script.src = url;

  document.body.appendChild(script);
}


// ==================================================
// AMBIL GPS HP
// ==================================================

function cekGPS(token) {

  const gpsStatus =
    document.getElementById("gpsStatus");


  if (!navigator.geolocation) {

    gpsStatus.innerHTML =
      "❌ Browser tidak mendukung GPS.";

    document.getElementById("status").innerText =
      "❌ GPS tidak tersedia.";

    return;
  }


  gpsStatus.innerHTML =
    "📍 Meminta izin lokasi...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      console.log("Latitude:", latitude);
      console.log("Longitude:", longitude);
      console.log("Akurasi:", accuracy);


      gpsStatus.innerHTML =
        "📍 Lokasi diperoleh.<br>" +
        "Akurasi GPS: " +
        Math.round(accuracy) +
        " meter.<br>" +
        "Memeriksa jarak ke outlet...";


      validasiLokasi(
        token,
        latitude,
        longitude
      );

    },

    function(error) {

      console.error(
        "GPS error:",
        error
      );


      let pesan =
        "❌ Lokasi tidak dapat diperoleh.";


      if (error.code === 1) {
        pesan =
          "❌ Izin lokasi ditolak. Silakan izinkan lokasi.";
      }

      else if (error.code === 2) {
        pesan =
          "❌ Lokasi tidak tersedia.";
      }

      else if (error.code === 3) {
        pesan =
          "❌ Waktu mendapatkan lokasi habis.";
      }


      gpsStatus.innerHTML =
        pesan;

      document.getElementById("status").innerText =
        "❌ Validasi lokasi gagal.";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


// ==================================================
// VALIDASI GPS KE SERVER
// ==================================================

function validasiLokasi(
  token,
  latitude,
  longitude
) {

  const callbackName =
    "nahyezGPS_" + Date.now();

  const script =
    document.createElement("script");


  const url =
    API_URL +
    "?action=validasiLokasi" +
    "&token=" +
    encodeURIComponent(token) +
    "&latitude=" +
    encodeURIComponent(latitude) +
    "&longitude=" +
    encodeURIComponent(longitude) +
    "&prefix=" +
    callbackName;


  window[callbackName] =
    async function(data) {

      console.log(
        "Hasil validasi lokasi:",
        data
      );


      delete window[callbackName];

      script.remove();


      const gpsStatus =
        document.getElementById("gpsStatus");


      // ==========================================
      // SERVER ERROR
      // ==========================================

      if (!data.success) {

        gpsStatus.innerHTML = `
          ❌ ${data.message}
        `;

        document.getElementById("status").innerText =
          "❌ Validasi lokasi gagal.";

        return;
      }


      // ==========================================
      // DALAM AREA
      // ==========================================

      if (data.dalamArea) {

        gpsStatus.innerHTML = `

          <div style="
            margin-top:10px;
            padding:12px;
            border-radius:12px;
            background:#e8f7ee;
            color:#198754;
          ">

            <b>✅ Lokasi Sesuai</b>

            <br><br>

            Jarak dari outlet:
            <b>${data.jarak} meter</b>

            <br>

            Radius diizinkan:
            <b>${data.radius} meter</b>

          </div>

        `;


        document.getElementById("status").innerText =
          "✅ Lokasi sesuai. Karyawan boleh melanjutkan absensi.";

        // Hentikan scanner QR
        try {
          await scanner.clear();
        } catch (error) {
          console.log("Scanner sudah berhenti.");
        }

        // Buka kamera belakang untuk foto booth
        bukaKameraBooth();
        
      }


      // ==========================================
      // DI LUAR AREA
      // ==========================================

      else {

        gpsStatus.innerHTML = `

          <div style="
            margin-top:10px;
            padding:12px;
            border-radius:12px;
            background:#fff0f0;
            color:#dc3545;
          ">

            <b>❌ Lokasi Di Luar Area</b>

            <br><br>

            Jarak dari outlet:
            <b>${data.jarak} meter</b>

            <br>

            Radius diizinkan:
            <b>${data.radius} meter</b>

          </div>

        `;


        document.getElementById("status").innerText =
          "❌ Karyawan berada di luar area outlet.";

      }

    };


  // ==============================================
  // TIMEOUT GPS API
  // ==============================================

  window.setTimeout(function() {

    if (window[callbackName]) {

      delete window[callbackName];

      script.remove();

      document.getElementById("status").innerText =
        "❌ Server tidak merespons.";

    }

  }, 15000);


  script.src = url;

  document.body.appendChild(script);
}


  // ==================================================
// KAMERA BOOTH
// ==================================================

let cameraStream = null;


// ==================================================
// BUKA KAMERA BELAKANG
// ==================================================

async function bukaKameraBooth() {

  const cameraSection =
    document.getElementById("cameraSection");

  const video =
    document.getElementById("cameraPreview");

  cameraSection.style.display = "block";

  document.getElementById("status").innerText =
    "📸 Membuka kamera belakang...";

  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }
        },

        audio: false

      });


    video.srcObject = cameraStream;

    await video.play();


    document.getElementById("status").innerText =
      "📸 Kamera siap. Foto kesiapan booth.";

  }

  catch (error) {

    console.error(
      "Kamera error:",
      error
    );

    document.getElementById("status").innerText =
      "❌ Kamera belakang tidak dapat dibuka.";

    cameraSection.innerHTML = `

      <div style="
        padding:15px;
        border-radius:12px;
        background:#fff0f0;
        color:#dc3545;
      ">

        <b>❌ Kamera tidak dapat digunakan</b>

        <br><br>

        Pastikan izin kamera diberikan
        kepada browser.

      </div>

    `;

  }

}


// ==================================================
// AMBIL FOTO BOOTH
// ==================================================

function ambilFotoBooth() {

  const video =
    document.getElementById("cameraPreview");

  const canvas =
    document.getElementById("photoCanvas");

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "Kamera belum siap. Tunggu beberapa detik."
    );

    return;
  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const context =
    canvas.getContext("2d");


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  // Matikan kamera setelah foto
  matikanKameraBooth();


  // Tampilkan hasil foto
  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.90
    );


  document.getElementById("cameraSection").innerHTML = `

    <div style="
      font-size:20px;
      font-weight:bold;
      margin-bottom:12px;
      color:#333;
    ">
      📸 Preview Foto Booth
    </div>

    <img
      src="${imageData}"
      style="
        width:100%;
        border-radius:16px;
        display:block;
      "
    >

    <button
      onclick="ambilUlangFoto()"
      style="
        width:100%;
        margin-top:12px;
        padding:14px;
        border:none;
        border-radius:14px;
        background:#777;
        color:white;
        font-size:16px;
        font-weight:bold;
      ">
      🔄 AMBIL ULANG
    </button>

    <button
      onclick="gunakanFoto()"
      style="
        width:100%;
        margin-top:10px;
        padding:14px;
        border:none;
        border-radius:14px;
        background:#198754;
        color:white;
        font-size:16px;
        font-weight:bold;
      ">
      ✅ GUNAKAN FOTO
    </button>

  `;


  // Simpan sementara untuk tahap berikutnya
  window.fotoBoothBase64 =
    imageData;


  document.getElementById("status").innerText =
    "📸 Foto berhasil diambil. Periksa hasilnya.";
}


// ==================================================
// MATIKAN KAMERA
// ==================================================

function matikanKameraBooth() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    cameraStream = null;
  }

}


// ==================================================
// AMBIL ULANG FOTO
// ==================================================

function ambilUlangFoto() {

  document.getElementById(
    "cameraSection"
  ).innerHTML = `

    <div style="
      font-size:20px;
      font-weight:bold;
      margin-bottom:12px;
      color:#333;
    ">
      📸 Foto Kesiapan Booth
    </div>

    <div style="
      color:#666;
      font-size:14px;
      margin-bottom:12px;
    ">
      Pastikan booth dan produk sudah
      tertata rapi.
    </div>

    <video
      id="cameraPreview"
      autoplay
      playsinline
      muted
      style="
        width:100%;
        border-radius:16px;
        background:#111;
        display:block;
      ">
    </video>

    <canvas
      id="photoCanvas"
      style="display:none;">
    </canvas>

    <button
      id="takePhotoButton"
      onclick="ambilFotoBooth()"
      style="
        width:100%;
        margin-top:15px;
        padding:15px;
        border:none;
        border-radius:14px;
        background:#ed7612;
        color:white;
        font-size:17px;
        font-weight:bold;
      ">
      📸 AMBIL FOTO BOOTH
    </button>

  `;

  bukaKameraBooth();
}


// ==================================================
// FOTO DIPILIH UNTUK ABSENSI
// ==================================================

function gunakanFoto() {

  document.getElementById("status").innerText =
    "✅ Foto booth siap digunakan.";

  console.log(
    "Foto booth siap dikirim:",
    window.fotoBoothBase64
  );

  // BELUM DIKIRIM KE SERVER.
  // Tahap berikutnya kita sambungkan
  // ke Google Drive + Sheet Absensi.

}

  
// ==================================================
// ERROR SCANNER
// ==================================================

function onScanFailure(error) {
  // Error sementara diabaikan.
}


// ==================================================
// QR SCANNER
// ==================================================

const scanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },
    false
  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
